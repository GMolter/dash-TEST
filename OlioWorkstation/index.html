<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olio Workstation</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#020617" />
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #020617; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="olio-startup" role="status" style="min-height:100vh;display:grid;place-content:center;text-align:center;gap:16px;color:#f8fafc;font-family:system-ui;padding:24px;box-sizing:border-box">
        <strong style="font-size:24px">Olio Workstation</strong>
        <span id="olio-startup-message">Loading your workspace…</span>
        <button id="olio-startup-retry" hidden style="border:1px solid #a78bfa;border-radius:12px;background:#7c3aed;color:white;padding:12px 20px;font:inherit;cursor:pointer">Reload Olio</button>
        <details id="olio-startup-details" hidden style="max-width:640px;text-align:left;overflow-wrap:anywhere">
          <summary>Loading error details</summary>
          <p id="olio-startup-error"></p>
        </details>
      </div>
    </div>
    <script>
      // This must run independently of the app bundle: a stale or failed module
      // cannot register its own service-worker update or render an error screen.
      (() => {
        const retry = document.getElementById('olio-startup-retry');
        let firstError = '';
        const showRecovery = (event) => {
          if (!document.getElementById('olio-startup')) return;
          if (!firstError && event) {
            const target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              firstError = 'Could not download application script: ' + new URL(target.src, location.href).pathname;
            } else {
              const reason = event.error || event.reason;
              firstError = event.message || (reason && reason.message) || '';
            }
          }
          document.getElementById('olio-startup-message').textContent = 'Olio couldn’t finish loading. Reload to get the latest version.';
          document.getElementById('olio-startup-error').textContent = firstError || 'The application did not start within 12 seconds. Check the browser Console for a failed script or startup error.';
          document.getElementById('olio-startup-details').hidden = false;
          retry.hidden = false;
        };
        retry.addEventListener('click', async () => {
          retry.disabled = true;
          retry.textContent = 'Reloading…';
          const resetCache = async () => {
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.filter(key => key.startsWith('olio-workstation-')).map(key => caches.delete(key)));
            }
          };
          const resetWorker = async () => {
            if (!('serviceWorker' in navigator)) return;
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.filter(registration => {
              const worker = registration.active || registration.waiting || registration.installing;
              return worker && worker.scriptURL === new URL('/sw.js', location.href).href;
            }).map(registration => registration.unregister()));
          };
          await Promise.race([
            Promise.allSettled([resetCache(), resetWorker()]),
            new Promise(resolve => setTimeout(resolve, 3000)),
          ]);
          window.location.reload();
        });
        window.addEventListener('error', showRecovery, true);
        window.addEventListener('unhandledrejection', showRecovery);
        window.setTimeout(showRecovery, 12000);
        if ('serviceWorker' in navigator && (navigator.serviceWorker.controller || !['localhost', '127.0.0.1'].includes(location.hostname))) {
          const hadController = !!navigator.serviceWorker.controller;
          let reloading = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hadController && !reloading) {
              reloading = true;
              window.location.reload();
            }
          });
          navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(registration => registration.update()).catch(() => {});
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
